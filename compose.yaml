name: agency-keyword-tracker
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_DB: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set through secure local environment collection}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build:
      context: .
      target: migrate
    environment: &app-environment
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: tracker
      POSTGRES_DB: tracker
      APP_ORIGIN: http://localhost:${WEB_PORT:-5173}
      COOKIE_SECURE: "false"
      NODE_ENV: development
      TRUST_PROXY_HOPS: "1"
    command: ["node", "scripts/database.mjs", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      target: api
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    build:
      context: .
      target: api
    environment: *app-environment
    command: ["node", "apps/api/dist/src/worker-main.js"]
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
